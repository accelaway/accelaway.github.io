<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Accelaway Launchpad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #0f1115;
      --panel: #151922;
      --text: #e6e8ee;
      --muted: #9aa3b2;
      --link: #5da9ff;
      --border: #23283a;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 720px;
      margin: 48px auto;
      padding: 0 24px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 32px;
    }

    section {
      margin-bottom: 36px;
    }

    h2 {
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    a {
      display: block;
      padding: 8px 0;
      font-size: 17px;
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Accelaway Launchpad</h1>

    <section>
      <h2>Work</h2>
      <a href="https://outlook.office.com">Outlook</a>
      <a href="https://teams.microsoft.com">Teams</a>
      <a href="https://onedrive.live.com">OneDrive</a>
      <a href="https://www.microsoft365.com/sharepoint">SharePoint</a>
    </section>

    <section>
      <h2>People & Insight</h2>
      <a href="https://www.microsoft365.com/search/people">People Search</a>
      <!-- add Org Explorer here -->
    </section>

    <section>
      <h2>Admin</h2>
      <a href="https://entra.microsoft.com">Entra ID</a>
      <a href="https://intune.microsoft.com">Intune</a>
      <a href="https://admin.microsoft.com">M365 Admin Center</a>
      <a href="https://security.microsoft.com">Microsoft Defender for Cloud Apps</a>
      <a href="https://compliance.microsoft.com">Microsoft Purview Compliance Portal</a>
      <a href="https://security.microsoft.com/secure-score">Microsoft Secure Score</a>
      <a href="https://portal.azure.com">Azure Portal</a>
    </section>
  </div>
</body>
</html>
