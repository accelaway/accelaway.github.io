<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Accelaway Launchpad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #0f1115;
      --panel: #151922;
      --text: #e6e8ee;
      --muted: #9aa3b2;
      --link: #5da9ff;
      --border: #23283a;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 720px;
      margin: 48px auto;
      padding: 0 24px;
    }

    .search-section {
      display: flex;
      gap: 16px;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }

    .search-bar {
      flex: 1;
      min-width: 200px;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--panel);
      color: var(--text);
      font-size: 16px;
    }

    .search-button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      background: var(--link);
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-left: 8px;
    }

    .search-button:hover {
      background: #4a8eff;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 32px;
    }

    section {
      margin-bottom: 36px;
    }

    h2 {
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px;
    }

    a {
      display: block;
      padding: 8px 0;
      font-size: 17px;
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .search-section {
        flex-direction: column;
      }

      .links {
        grid-template-columns: 1fr;
      }
    }

    @media (orientation: portrait) {
      .links {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (orientation: landscape) {
      .links {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Accelaway Launchpad</h1>

    <!-- Search Bars -->
    <section class="search-section">
      <div class="search-bar">
        <form action="https://www.bing.com/search" method="get" target="_blank">
          <input type="text" name="q" placeholder="Search with Edge Copilot" class="search-input">
          <button type="submit" class="search-button">Search</button>
        </form>
      </div>
      <div class="search-bar">
        <form action="https://www.google.com/search" method="get" target="_blank">
          <input type="text" name="q" placeholder="Search with Gemini" class="search-input">
          <button type="submit" class="search-button">Search</button>
        </form>
      </div>
    </section>

    <section>
      <h2>Work</h2>
      <div class="links">
        <a href="https://outlook.office.com">Outlook</a>
        <a href="https://teams.microsoft.com">Teams</a>
        <a href="https://onedrive.live.com">OneDrive</a>
        <a href="https://www.microsoft365.com/sharepoint">SharePoint</a>
      </div>
    </section>

    <section>
      <h2>People & Insight</h2>
      <div class="links">
        <a href="https://www.microsoft365.com/search/people">People Search</a>
        <!-- add Org Explorer here -->
      </div>
    </section>

    <section>
      <h2>Admin</h2>
      <div class="links">
        <a href="https://admin.microsoft.com">M365 Admin</a>
        <a href="https://entra.microsoft.com">Ms Entra</a>
        <a href="https://intune.microsoft.com">Ms Intune</a>
        <a href="https://portal.azure.com">Ms Azure Portal</a>
        <a href="https://security.microsoft.com">Ms Defender</a>
        <a href="https://compliance.microsoft.com">Ms Purview</a>
        <a href="https://admin.exchange.microsoft.com">Ms Exchange</a>
        <a href="javascript:void(0)" onclick="openTenantLink('https://{tenant}-admin.sharepoint.com/_layouts/15/online/AdminHome.aspx#/home'); return false;">Ms SharePoint</a>
        <a href="https://admin.teams.microsoft.com">Ms Teams</a>
      </div>
    </section>
  </div>

  <script>
    function openTenantLink(template) {
      const tenant = prompt('Enter your tenant name or tenant ID:');
      if (!tenant) return false;
      const url = template.replace('{tenant}', encodeURIComponent(tenant.trim()));
      const newWindow = window.open(url, '_blank');
      if (newWindow) {
        newWindow.focus();
      } else {
        alert('Unable to open a new tab. Please allow popups for this page and try again.');
      }
      return false;
    }
  </script>
</body>
</html>
